<!doctype html>
<!--
  Français, et non traduisible : la traduction automatique du navigateur
  réécrit les textes de la page sous React, qui plante ensuite en changeant
  d'écran (« Failed to execute 'insertBefore' on 'Node' »), souvent juste
  après la connexion.
-->
<html lang="fr" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ongo 237</title>
  <!-- DM Sans : la graisse geometrique des consoles d'hebergement, qui porte
       les gros titres sans les durcir et reste lisible en onze pixels. Inter
       reste charge pour la page d'impression des courses ; Manrope,
       qu'aucun theme ne declarait, ne servait a rien. -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <!-- Les icones : seulement les axes servis. Toute la plage (graisses 100 a
       700, tailles 20 a 48, grades) pesait 4 Mo ; le menu affichait les noms
       des ligatures — « local_taxi », « expand_less » — le temps qu'elle
       arrive. L'application n'utilise que la graisse 400, la taille 24 et le
       remplissage plein ou vide : 460 Ko. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" />
  <!-- Et masquees jusqu'a ce qu'elle soit la : `display=block` ne retient le
       texte que trois secondes, ce qu'une connexion mobile depasse. En cas
       d'echec, on les montre quand meme : un nom vaut mieux qu'un trou. -->
  <script>
    document.documentElement.classList.add('icones-en-attente');
    if (document.fonts && document.fonts.load) {
      document.fonts.load("24px 'Material Symbols Outlined'").finally(function () {
        document.documentElement.classList.remove('icones-en-attente');
      });
    } else {
      document.documentElement.classList.remove('icones-en-attente');
    }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
